<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全100ステージの絵</title>
<style>body{margin:0;padding:24px;background:#f8f6ee;color:#29473f;font-family:system-ui,sans-serif}h1{font-size:24px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}a{display:block;color:inherit;text-decoration:none;background:#fff;padding:12px;border-radius:12px}canvas{width:100%;height:220px;object-fit:contain;image-rendering:pixelated}h2{font-size:14px;min-height:40px}small{font-size:12px}</style></head>
<body><h1>全100ステージの絵</h1><p>絵をタップするとデバッグ試遊を開始します。</p><p><a href="../">ゲームへ戻る</a></p><div id="gallery" class="gallery"></div>
<script type="module">
const catalog=await(await fetch('../stages/index.json')).json();
for(const entry of catalog.stages){const data=await(await fetch('../stages/'+entry.file)).json(),art=data.art;
const link=document.createElement('a');link.href='../?debug=1&stage='+entry.id;
const title=document.createElement('h2');title.textContent=String(entry.id).padStart(3,'0')+' '+entry.name;
const canvas=document.createElement('canvas');canvas.width=art.width;canvas.height=art.height;
const context=canvas.getContext('2d');art.pixels.forEach((row,y)=>row.forEach((color,x)=>{if(color!==null){context.fillStyle=art.palette[color].hex;context.fillRect(x,y,1,1);}}));
const note=document.createElement('small');note.textContent=art.width+'×'+art.height+' · '+art.palette.length+'色 · '+data.boxCount+'箱';
link.append(title,canvas,note);document.getElementById('gallery').append(link);}
</script></body></html>
